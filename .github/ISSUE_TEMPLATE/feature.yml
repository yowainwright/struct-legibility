---
name: Feature request
description: Propose a rule, language pack, or CLI capability.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which source structure cannot be expressed today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the expected config, CLI, or API behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List any workarounds or competing designs considered.
