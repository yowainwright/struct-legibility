---
name: CodeQL

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: C
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build C analyzer
        run: |
          cmake -S . -B .build/codeql -DCMAKE_BUILD_TYPE=Debug
          cmake --build .build/codeql --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4
