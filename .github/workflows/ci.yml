---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9

      - name: Locate Bun cache
        id: bun-cache
        run: echo "directory=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.bun-cache.outputs.directory }}
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh tests/e2e/*.sh

      - name: Test
        run: bun run test

      - name: Upload binary
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: struct-legibility-${{ matrix.artifact }}
          path: .build/struct-legibility
          if-no-files-found: error
          retention-days: 7
