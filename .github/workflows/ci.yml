---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 / Node 22
            os: ubuntu-24.04
            node: 22
            upload: false
            artifact: linux-x64-node-22
          - name: Linux x64 / Node 24
            os: ubuntu-24.04
            node: 24
            upload: false
            artifact: linux-x64-node-24
          - name: Linux x64 / Node 26
            os: ubuntu-24.04
            node: 26
            upload: true
            artifact: linux-x64
          - name: macOS ARM64 / Node 26
            os: macos-15
            node: 26
            upload: true
            artifact: macos-arm64
          - name: macOS x64 / Node 26
            os: macos-15-intel
            node: 26
            upload: true
            artifact: macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: nub ci

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh scripts/hooks/* tests/e2e/*.sh

      - name: Check dependency overrides
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 26
        run: nub run overrides:check

      - name: Test
        run: nub run test

      - name: Benchmark
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 26
        run: nub run benchmark

      - name: Upload binary
        if: matrix.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: struct-legibility-${{ matrix.artifact }}
          path: .build/struct-legibility
          if-no-files-found: error
          retention-days: 7
