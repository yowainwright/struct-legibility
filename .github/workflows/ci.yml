---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh scripts/hooks/* tests/e2e/*.sh

      - name: Test
        run: ./scripts/check.sh

      - name: Benchmark
        if: runner.os == 'Linux'
        run: ./scripts/benchmark.sh

      - name: Verify release archive
        run: |
          tar -czf .build/release.tar.gz LICENSE LICENSES -C .build struct-lint
          ./tests/e2e/test-release.sh .build/release.tar.gz

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: struct-lint-${{ matrix.artifact }}
          path: .build/struct-lint
          if-no-files-found: error
          retention-days: 7
