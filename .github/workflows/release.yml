---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
          node-version: 26

      - name: Install dependencies
        run: nub ci

      - name: Verify release version
        run: |
          package_version="$(
            node -e \
              'process.stdout.write(require("./package.json").version)'
          )"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Test
        run: nub run test

      - name: Package binary
        env:
          ARCHIVE: struct-legibility-${{ matrix.artifact }}.tar.gz
        run: |
          mkdir -p dist
          tar -czf "dist/$ARCHIVE" -C .build struct-legibility

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --generate-notes --verify-tag
